# slow-queries-extend.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-slow-queries
  namespace: monitoring
data:
  queries.yaml: |
    pg_slow_queries:
      query: |
        WITH slow_queries AS (
          SELECT 
            datname,
            usename,
            application_name,
            client_addr,
            state,
            query,
            EXTRACT(EPOCH FROM (now() - query_start))::float AS duration_seconds,
            EXTRACT(EPOCH FROM (now() - xact_start))::float AS xact_duration_seconds
          FROM pg_stat_activity 
          WHERE 
            state = 'active'
            AND query_start IS NOT NULL
            AND query NOT LIKE '%pg_stat_activity%'
            AND query NOT LIKE '%pg_stat_statements%'
            AND query NOT LIKE '%pg_catalog%'
            AND datname IS NOT NULL
          ORDER BY (now() - query_start) DESC
          LIMIT 10
        )
        SELECT 
          datname,
          usename,
          application_name,
          client_addr::text,
          state,
          query,
          duration_seconds,
          xact_duration_seconds,
          CASE 
            WHEN duration_seconds > 300 THEN 'critical'
            WHEN duration_seconds > 60 THEN 'warning'
            WHEN duration_seconds > 10 THEN 'notice'
            ELSE 'normal'
          END AS severity
        FROM slow_queries
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "User name"
        - application_name:
            usage: "LABEL"
            description: "Application name"
        - client_addr:
            usage: "LABEL"
            description: "Client IP address"
        - state:
            usage: "LABEL"
            description: "Query state"
        - severity:
            usage: "LABEL"
            description: "Query severity level"
        - query:
            usage: "LABEL"
            description: "SQL query text (truncated)"
        - duration_seconds:
            usage: "GAUGE"
            description: "Query execution duration in seconds"
        - xact_duration_seconds:
            usage: "GAUGE"
            description: "Transaction duration in seconds"
    
    pg_stat_statements_runtime:
      query: |
        SELECT 
          pss.queryid,
          pd.datname,
          pu.usename,
          LEFT(pss.query, 300) as query_sample,
          pss.calls,
          pss.total_exec_time as total_exec_time_ms,
          pss.mean_exec_time as mean_exec_time_ms,
          pss.min_exec_time as min_exec_time_ms,
          pss.max_exec_time as max_exec_time_ms,
          pss.stddev_exec_time as stddev_exec_time_ms,
          -- 计算百分位数（如果支持）
          pss.total_plan_time as total_plan_time_ms,
          pss.mean_plan_time as mean_plan_time_ms,
          -- 性能指标
          pss.rows,
          pss.shared_blks_hit,
          pss.shared_blks_read,
          pss.shared_blks_hit + pss.shared_blks_read as shared_blks_total,
          CASE 
            WHEN (pss.shared_blks_hit + pss.shared_blks_read) > 0 
            THEN pss.shared_blks_hit::float / (pss.shared_blks_hit + pss.shared_blks_read) 
            ELSE 0 
          END as cache_hit_ratio,
          -- 执行频率
          CASE 
            WHEN pss.calls > 0 
            THEN pss.total_exec_time / pss.calls 
            ELSE 0 
          END as avg_exec_time_per_call_ms,
          -- 时间窗口
          now() - pss.query_start_time as query_age,
          -- 分类
          CASE 
            WHEN pss.mean_exec_time > 1000 THEN 'very_slow'
            WHEN pss.mean_exec_time > 100 THEN 'slow'
            WHEN pss.mean_exec_time > 10 THEN 'medium'
            ELSE 'fast'
          END as performance_category
        FROM pg_stat_statements pss
        JOIN pg_database pd ON pd.oid = pss.dbid
        JOIN pg_user pu ON pu.usesysid = pss.userid
        WHERE 
          pd.datname NOT IN ('template0', 'template1')
          AND pd.datname = 'db-instance-xia'  -- 指定您的数据库
        ORDER BY pss.total_exec_time DESC
      metrics:
        - queryid:
            usage: "LABEL"
            description: "Query ID"
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "Username"
        - query_sample:
            usage: "LABEL"
            description: "Query sample (truncated)"
        - performance_category:
            usage: "LABEL"
            description: "Performance category"
        - calls:
            usage: "COUNTER"
            description: "Number of times executed"
        - total_exec_time_ms:
            usage: "GAUGE"
            description: "Total execution time in milliseconds"
        - mean_exec_time_ms:
            usage: "GAUGE"
            description: "Mean execution time in milliseconds"
        - min_exec_time_ms:
            usage: "GAUGE"
            description: "Minimum execution time in milliseconds"
        - max_exec_time_ms:
            usage: "GAUGE"
            description: "Maximum execution time in milliseconds"
        - stddev_exec_time_ms:
            usage: "GAUGE"
            description: "Standard deviation of execution time in milliseconds"
        - total_plan_time_ms:
            usage: "GAUGE"
            description: "Total planning time in milliseconds"
        - mean_plan_time_ms:
            usage: "GAUGE"
            description: "Mean planning time in milliseconds"
        - avg_exec_time_per_call_ms:
            usage: "GAUGE"
            description: "Average execution time per call in milliseconds"
        - rows:
            usage: "COUNTER"
            description: "Total rows retrieved or affected"
        - shared_blks_hit:
            usage: "COUNTER"
            description: "Shared blocks cache hits"
        - shared_blks_read:
            usage: "COUNTER"
            description: "Shared blocks read from disk"
        - shared_blks_total:
            usage: "COUNTER"
            description: "Total shared blocks accessed"
        - cache_hit_ratio:
            usage: "GAUGE"
            description: "Cache hit ratio (0-1)"

    pg_slow_queries_hourly:
      query: |
        WITH current_slow_queries AS (
          SELECT 
            datname,
            usename,
            LEFT(md5(query), 8) as query_hash,
            COUNT(*) as active_count,
            MAX(EXTRACT(EPOCH FROM (now() - query_start)))::float as max_duration,
            AVG(EXTRACT(EPOCH FROM (now() - query_start)))::float as avg_duration
          FROM pg_stat_activity 
          WHERE 
            state = 'active'
            AND query_start IS NOT NULL
            AND query_start > now() - interval '1 hour'
            AND datname = 'db-instance-xia'  -- 指定您的数据库
          GROUP BY datname, usename, LEFT(md5(query), 8)
        )
        SELECT 
          datname,
          usename,
          query_hash,
          active_count,
          max_duration,
          avg_duration,
          CASE 
            WHEN max_duration > 300 THEN 3
            WHEN max_duration > 60 THEN 2
            WHEN max_duration > 10 THEN 1
            ELSE 0
          END as severity_level
        FROM current_slow_queries
        ORDER BY max_duration DESC
        LIMIT 20
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "User name"
        - query_hash:
            usage: "LABEL"
            description: "Query hash (first 8 chars of MD5)"
        - active_count:
            usage: "GAUGE"
            description: "Number of active executions"
        - max_duration:
            usage: "GAUGE"
            description: "Maximum query duration in seconds"
        - avg_duration:
            usage: "GAUGE"
            description: "Average query duration in seconds"
        - severity_level:
            usage: "GAUGE"
            description: "Severity level (0=normal, 1=notice, 2=warning, 3=critical)"