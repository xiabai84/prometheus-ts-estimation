# optimized-minimal-queries.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-optimized
  namespace: monitoring
data:
  queries.yaml: |
    # ======================= 优化版：只返回必需的5个指标 =======================
    pg_stat_statements_essential:
      query: |
        SELECT 
          pss.queryid::text as queryid,
          pd.datname as datname,
          pu.usename as usename,
          LEFT(
            CASE 
              -- 清理查询文本，移除换行和多余空格
              WHEN pss.query LIKE '/*%*/%' 
              THEN REGEXP_REPLACE(pss.query, '/\*.*?\*/', '', 'g')
              ELSE pss.query
            END, 
            150
          ) as query_short,
          COALESCE(pss.max_exec_time, 0) as max_exec_time
        FROM pg_stat_statements pss
        JOIN pg_database pd ON pd.oid = pss.dbid
        JOIN pg_user pu ON pu.usesysid = pss.userid
        WHERE pd.datname NOT IN ('template0', 'template1')
          AND pd.datname IS NOT NULL
          -- 可选：过滤掉一些系统查询
          AND NOT (pss.query LIKE 'DEALLOCATE%' OR pss.query LIKE '%pg_stat%')
      metrics:
        - queryid:
            usage: "LABEL"
            description: "Query ID (hash)"
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "Username"
        - query_short:
            usage: "LABEL"
            description: "Query text (first 150 chars, cleaned)"
        - max_exec_time:
            usage: "GAUGE"
            description: "Maximum execution time in milliseconds"
    
    # ======================= 备选方案：进一步优化的版本 =======================
    # 如果上面的查询仍然有性能问题，使用这个更轻量的版本
    pg_stat_statements_minimal:
      query: |
        SELECT 
          pss.queryid::text,
          pd.datname,
          pu.usename,
          -- 只取前100字符，并移除注释
          REGEXP_REPLACE(
            SUBSTRING(pss.query FROM 1 FOR 100), 
            '--.*?(\n|$)|/\*.*?\*/', 
            '', 
            'g'
          ) as query_short,
          GREATEST(
            COALESCE(pss.max_exec_time, 0),
            COALESCE(pss.mean_exec_time, 0)
          ) as max_exec_time_approx
        FROM pg_stat_statements pss
        INNER JOIN pg_database pd ON pd.oid = pss.dbid
        INNER JOIN pg_user pu ON pu.usesysid = pss.userid
        WHERE pd.datname NOT LIKE 'template%'
          AND pss.calls > 0  -- 确保至少执行过一次
      metrics:
        - queryid:
            usage: "LABEL"
        - datname:
            usage: "LABEL"
        - usename:
            usage: "LABEL"
        - query_short:
            usage: "LABEL"
        - max_exec_time_approx:
            usage: "GAUGE"
            description: "Approximate max execution time (ms)"
    
    # ======================= 聚合版本：减少基数 =======================
    # 如果单个查询太多导致高基数问题，可以使用这个聚合版本
    pg_stat_statements_aggregated:
      query: |
        WITH top_queries AS (
          SELECT 
            pss.queryid,
            pd.datname,
            pu.usename,
            LEFT(pss.query, 100) as query_sample,
            pss.max_exec_time,
            ROW_NUMBER() OVER (PARTITION BY pd.datname, pu.usename ORDER BY pss.max_exec_time DESC) as rn
          FROM pg_stat_statements pss
          JOIN pg_database pd ON pd.oid = pss.dbid
          JOIN pg_user pu ON pu.usesysid = pss.userid
          WHERE pd.datname NOT IN ('template0', 'template1')
            AND pss.max_exec_time > 100  -- 只关注执行时间超过100ms的查询
        )
        SELECT 
          queryid::text,
          datname,
          usename,
          query_sample as query_short,
          max_exec_time
        FROM top_queries
        WHERE rn <= 50  -- 每个用户在每个数据库中最多取50个最慢查询
      metrics:
        - queryid:
            usage: "LABEL"
        - datname:
            usage: "LABEL"
        - usename:
            usage: "LABEL"
        - query_short:
            usage: "LABEL"
        - max_exec_time:
            usage: "GAUGE"