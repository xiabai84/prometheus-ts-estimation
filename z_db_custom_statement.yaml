# slow-queries-extend.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-slow-queries
  namespace: monitoring
data:
  queries.yaml: |
    pg_stat_statements_runtime:
      query: |
        SELECT 
          queryid::text,
          datname,
          usename,
          LEFT(query, 400) as query_sample,
          calls,
          total_exec_time,
          mean_exec_time,
          min_exec_time,
          max_exec_time,
          rows,
          shared_blks_hit,
          shared_blks_read
        FROM pg_stat_statements pss
        JOIN pg_database pd ON pd.oid = pss.dbid
        JOIN pg_user pu ON pu.usesysid = pss.userid
        WHERE pd.datname NOT IN ('template0', 'template1')
      metrics:
        - queryid:
            usage: "LABEL"
            description: "Query ID"
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "Username"
        - query_sample:
            usage: "LABEL"
            description: "Query sample"
        - calls:
            usage: "COUNTER"
            description: "Number of calls"
        - total_exec_time:
            usage: "GAUGE"
            description: "Total execution time (ms)"
        - mean_exec_time:
            usage: "GAUGE"
            description: "Mean execution time (ms)"
        - min_exec_time:
            usage: "GAUGE"
            description: "Min execution time (ms)"
        - max_exec_time:
            usage: "GAUGE"
            description: "Max execution time (ms)"
        - rows:
            usage: "COUNTER"
            description: "Total rows"
        - shared_blks_hit:
            usage: "COUNTER"
            description: "Shared blocks hit"
        - shared_blks_read:
            usage: "COUNTER"
            description: "Shared blocks read"