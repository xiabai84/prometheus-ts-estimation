# slow-queries-extend.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-slow-queries
  namespace: monitoring
data:
  queries.yaml: |
    pg_slow_queries:
      query: |
        WITH slow_queries AS (
          SELECT 
            datname,
            usename,
            application_name,
            client_addr,
            state,
            query,
            EXTRACT(EPOCH FROM (now() - query_start))::float AS duration_seconds,
            EXTRACT(EPOCH FROM (now() - xact_start))::float AS xact_duration_seconds
          FROM pg_stat_activity 
          WHERE 
            state = 'active'
            AND query_start IS NOT NULL
            AND query NOT LIKE '%pg_stat_activity%'
            AND query NOT LIKE '%pg_stat_statements%'
            AND query NOT LIKE '%pg_catalog%'
            AND datname IS NOT NULL
          ORDER BY (now() - query_start) DESC
          LIMIT 10
        )
        SELECT 
          datname,
          usename,
          application_name,
          client_addr::text,
          state,
          query,
          duration_seconds,
          xact_duration_seconds,
          CASE 
            WHEN duration_seconds > 300 THEN 'critical'
            WHEN duration_seconds > 60 THEN 'warning'
            WHEN duration_seconds > 10 THEN 'notice'
            ELSE 'normal'
          END AS severity
        FROM slow_queries
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "User name"
        - application_name:
            usage: "LABEL"
            description: "Application name"
        - client_addr:
            usage: "LABEL"
            description: "Client IP address"
        - state:
            usage: "LABEL"
            description: "Query state"
        - severity:
            usage: "LABEL"
            description: "Query severity level"
        - query:
            usage: "LABEL"
            description: "SQL query text (truncated)"
        - duration_seconds:
            usage: "GAUGE"
            description: "Query execution duration in seconds"
        - xact_duration_seconds:
            usage: "GAUGE"
            description: "Transaction duration in seconds"
    
    pg_stat_statements_slow:
      query: |
        SELECT 
          datname,
          usename,
          queryid,
          LEFT(query, 200) as query_sample,
          calls,
          total_exec_time,
          mean_exec_time,
          rows,
          shared_blks_hit,
          shared_blks_read,
          shared_blks_dirtied,
          shared_blks_written,
          local_blks_hit,
          local_blks_read,
          local_blks_dirtied,
          local_blks_written,
          temp_blks_read,
          temp_blks_written,
          blk_read_time,
          blk_write_time
        FROM pg_stat_statements 
        JOIN pg_database ON pg_database.oid = pg_stat_statements.dbid
        JOIN pg_user ON pg_user.usesysid = pg_stat_statements.userid
        WHERE 
          pg_database.datname NOT IN ('template0', 'template1')
          AND mean_exec_time > 100
        ORDER BY mean_exec_time DESC
        LIMIT 10
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "User name"
        - queryid:
            usage: "LABEL"
            description: "Query ID"
        - query_sample:
            usage: "LABEL"
            description: "Query sample (first 200 chars)"
        - calls:
            usage: "COUNTER"
            description: "Number of times executed"
        - total_exec_time:
            usage: "GAUGE"
            description: "Total execution time in milliseconds"
        - mean_exec_time:
            usage: "GAUGE"
            description: "Mean execution time in milliseconds"
        - rows:
            usage: "COUNTER"
            description: "Total rows retrieved or affected"
        - shared_blks_hit:
            usage: "COUNTER"
            description: "Shared block cache hits"
        - shared_blks_read:
            usage: "COUNTER"
            description: "Shared blocks read"
    
    pg_slow_queries_hourly:
      query: |
        WITH current_slow_queries AS (
          SELECT 
            datname,
            usename,
            LEFT(md5(query), 8) as query_hash,
            COUNT(*) as active_count,
            MAX(EXTRACT(EPOCH FROM (now() - query_start)))::float as max_duration,
            AVG(EXTRACT(EPOCH FROM (now() - query_start)))::float as avg_duration
          FROM pg_stat_activity 
          WHERE 
            state = 'active'
            AND query_start IS NOT NULL
            AND query_start > now() - interval '1 hour'
            AND datname = 'db-instance-xia'  -- 指定您的数据库
          GROUP BY datname, usename, LEFT(md5(query), 8)
        )
        SELECT 
          datname,
          usename,
          query_hash,
          active_count,
          max_duration,
          avg_duration,
          CASE 
            WHEN max_duration > 300 THEN 3
            WHEN max_duration > 60 THEN 2
            WHEN max_duration > 10 THEN 1
            ELSE 0
          END as severity_level
        FROM current_slow_queries
        ORDER BY max_duration DESC
        LIMIT 20
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - usename:
            usage: "LABEL"
            description: "User name"
        - query_hash:
            usage: "LABEL"
            description: "Query hash (first 8 chars of MD5)"
        - active_count:
            usage: "GAUGE"
            description: "Number of active executions"
        - max_duration:
            usage: "GAUGE"
            description: "Maximum query duration in seconds"
        - avg_duration:
            usage: "GAUGE"
            description: "Average query duration in seconds"
        - severity_level:
            usage: "GAUGE"
            description: "Severity level (0=normal, 1=notice, 2=warning, 3=critical)"